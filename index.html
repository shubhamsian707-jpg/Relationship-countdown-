<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>D ♡ S — OUR LITTLE STORY</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  color:white;
  font-family:Montserrat,sans-serif;

  background:
    radial-gradient(circle at 50% 40%,rgba(255,30,100,.14),transparent 35%),
    radial-gradient(circle at 10% 10%,rgba(170,20,80,.14),transparent 30%),
    radial-gradient(circle at 90% 90%,rgba(255,30,100,.10),transparent 30%),
    linear-gradient(145deg,#050205,#12050c,#210711,#070307);
}


/* BACKGROUND GLOW */

.glow{
  position:fixed;
  width:320px;
  height:320px;
  border-radius:50%;
  filter:blur(100px);
  pointer-events:none;
  opacity:.25;
}

.glow.one{
  background:#ff176f;
  top:-170px;
  left:-150px;
}

.glow.two{
  background:#a50048;
  right:-150px;
  bottom:-180px;
}


/* CARD */

.card{
  position:relative;
  z-index:2;

  width:min(92%,500px);

  padding:30px 22px 28px;

  text-align:center;

  border:1px solid rgba(255,110,160,.2);

  border-radius:30px;

  background:rgba(15,3,10,.48);

  backdrop-filter:blur(18px);

  box-shadow:
    0 30px 100px rgba(0,0,0,.65),
    0 0 50px rgba(255,30,100,.08);
}


/* ==================================================
   PASTA AREA
================================================== */

.meteor-area{
  position:relative;
  height:90px;
  margin-bottom:5px;
}


/* TINY CHEF HAT */

.chef-hat{
  position:absolute;

  left:50%;
  top:3px;

  transform:translateX(-50%);

  font-size:19px;

  opacity:0;

  animation:
    chefFloat 3.5s ease-in-out infinite,
    chefGlow 2s ease-in-out infinite;

  filter:
    drop-shadow(0 0 5px #ff75a9)
    drop-shadow(0 0 12px rgba(255,50,130,.7));

  z-index:4;

  pointer-events:none;
}

@keyframes chefFloat{

  0%,100%{
    transform:translateX(-50%) translateY(0);
  }

  50%{
    transform:translateX(-50%) translateY(-6px);
  }

}

@keyframes chefGlow{

  0%,100%{
    opacity:.45;
  }

  50%{
    opacity:1;
  }

}


/* PASTA TEXT */

.pasta-note{
  position:absolute;

  left:50%;
  top:38px;

  transform:translateX(-50%);

  width:100%;

  font-size:10px;

  font-weight:600;

  letter-spacing:2px;

  color:#ffb3cb;

  opacity:.78;

  white-space:nowrap;

  text-shadow:
    0 0 8px rgba(255,70,140,.45);

}


/* INITIALS */

.initials{
  font-size:14px;
  font-weight:600;
  letter-spacing:4px;
  color:#ffb0c9;
  margin-bottom:17px;
}

.initials span{
  animation:pulse 2s infinite;
  display:inline-block;
}

@keyframes pulse{

  50%{
    transform:scale(1.2);
    text-shadow:0 0 15px #ff4d91;
  }

}


/* TITLE */

.title{
  margin:0;

  font-size:28px;

  font-weight:600;

  letter-spacing:6px;
}

.since{
  margin-top:10px;

  font-size:10px;

  letter-spacing:2px;

  opacity:.48;
}


/* ==================================================
   COUNTDOWN
================================================== */

.countdown{

  margin-top:30px;

  padding:27px 14px 23px;

  border:1px solid rgba(255,70,130,.52);

  border-radius:24px;

  background:
    linear-gradient(
      145deg,
      rgba(255,30,100,.075),
      rgba(255,255,255,.025)
    );

  box-shadow:
    0 0 25px rgba(255,30,100,.15);

}


.duration{

  font-size:23px;

  font-weight:600;

  letter-spacing:2px;

}


.time{

  margin-top:16px;

  font-size:15px;

  font-weight:500;

  letter-spacing:2px;

  opacity:.88;

}


.total{

  margin-top:20px;

  padding-top:16px;

  border-top:1px solid rgba(255,255,255,.08);

  font-size:8px;

  letter-spacing:3px;

  opacity:.45;

}


.total-number{

  margin-top:6px;

  font-size:16px;

  font-weight:600;

  letter-spacing:2px;

}


/* LOVE LINES */

.line-box{

  min-height:58px;

  margin-top:24px;

  display:flex;

  justify-content:center;

  align-items:center;

}


.love-line{

  max-width:390px;

  font-size:12px;

  font-weight:500;

  line-height:1.8;

  letter-spacing:2px;

  opacity:0;

  transform:translateY(5px);

  transition:opacity 1.5s,transform 1.5s;

}


.love-line.show{

  opacity:.78;

  transform:translateY(0);

}


/* FOOTER */

.footer{

  margin-top:20px;

  font-size:8px;

  letter-spacing:3px;

  opacity:.25;

}


@media(max-width:400px){

  .card{
    padding:28px 15px 25px;
  }

  .title{
    font-size:24px;
    letter-spacing:4px;
  }

  .duration{
    font-size:20px;
  }

  .time{
    font-size:13px;
  }

  .love-line{
    font-size:11px;
  }

  .pasta-note{
    font-size:9px;
  }

}

</style>
</head>


<body>

<div class="glow one"></div>
<div class="glow two"></div>


<div class="card">


  <!-- TINY CUTE PASTA MOMENT -->

  <div class="meteor-area">

    <div class="chef-hat">
      👨‍🍳
    </div>

    <div class="pasta-note">
      SUNDAY PASTA FOR ME? 🍝❤️
    </div>

  </div>


  <div class="initials">

    D <span>♡</span> S

    •

    SINCE 30 MAY 2026

  </div>


  <h1 class="title">

    OUR LITTLE STORY

  </h1>


  <div class="since">

    12:40 PM

  </div>


  <!-- COUNTDOWN -->

  <div class="countdown">

    <div
      class="duration"
      id="duration">

      00 MONTHS • 00 DAYS

    </div>


    <div
      class="time"
      id="time">

      00 HRS • 00 MINS • 00 SECS

    </div>


    <div class="total">

      TOTAL SECONDS

    </div>


    <div
      class="total-number"
      id="totalSeconds">

      0

    </div>

  </div>


  <!-- LOVE LINES -->

  <div class="line-box">

    <div
      class="love-line"
      id="loveLine">
    </div>

  </div>


  <div class="footer">

    EVERY SECOND BECOMES A MEMORY.

  </div>


</div>


<script>

/* ==================================================
   COUNTDOWN
================================================== */

const start =
  new Date("2026-05-30T12:40:00+05:30");


function updateTimer(){

  const now =
    new Date();


  const difference =
    now - start;


  if(difference < 0){

    document.getElementById("duration").textContent =
      "00 MONTHS • 00 DAYS";

    document.getElementById("time").textContent =
      "00 HRS • 00 MINS • 00 SECS";

    document.getElementById("totalSeconds").textContent =
      "0";

    return;

  }


  const totalSeconds =
    Math.floor(
      difference / 1000
    );


  let cursor =
    new Date(start);


  let months =
    0;


  while(true){

    const next =
      new Date(cursor);


    next.setMonth(
      next.getMonth() + 1
    );


    if(next <= now){

      months++;

      cursor =
        next;

    }else{

      break;

    }

  }


  let remaining =
    now - cursor;


  const days =
    Math.floor(
      remaining / 86400000
    );


  remaining %=
    86400000;


  const hours =
    Math.floor(
      remaining / 3600000
    );


  remaining %=
    3600000;


  const minutes =
    Math.floor(
      remaining / 60000
    );


  const seconds =
    Math.floor(
      (remaining % 60000) / 1000
    );


  document.getElementById("duration").textContent =

    String(months).padStart(2,"0") +

    " MONTHS • " +

    String(days).padStart(2,"0") +

    " DAYS";


  document.getElementById("time").textContent =

    String(hours).padStart(2,"0") +

    " HRS • " +

    String(minutes).padStart(2,"0") +

    " MINS • " +

    String(seconds).padStart(2,"0") +

    " SECS";


  document.getElementById("totalSeconds").textContent =

    totalSeconds.toLocaleString();

}


/* START COUNTDOWN */

updateTimer();

setInterval(
  updateTimer,
  1000
);


/* ==================================================
   15 LOVE LINES
================================================== */

const loveLines = [

  "EVERY SECOND WITH YOU MATTERS. ❤️",

  "STILL MY FAVORITE PERSON. ❤️",

  "ANOTHER SECOND. ANOTHER MEMORY OF US.",

  "YOU MAKE TIME FEEL BEAUTIFUL. ❤️",

  "ONE MORE LITTLE MEMORY OF US. 💗",

  "EVERY DAY WITH YOU FEELS SPECIAL.",

  "STILL CHOOSING US. ❤️",

  "YOU MAKE ORDINARY MOMENTS SPECIAL.",

  "ANOTHER SECOND. ANOTHER REASON TO SMILE. 💕",

  "SOMEHOW, I LOVE YOU A LITTLE MORE TODAY.",

  "OUR LITTLE FOREVER KEEPS GROWING. ❤️",

  "YOU ARE MY FAVORITE PART OF EVERY DAY.",

  "TIME PASSES. OUR MEMORIES STAY.",

  "JUST YOU AND ME, ONE SECOND AT A TIME. ❤️",

  "HERE'S TO EVERY SECOND STILL TO COME. 💗"

];


let lineIndex =
  0;


const loveLine =
  document.getElementById(
    "loveLine"
  );


function showNextLine(){

  loveLine.classList.remove(
    "show"
  );


  setTimeout(function(){

    loveLine.textContent =
      loveLines[lineIndex];


    lineIndex =
      (lineIndex + 1) %
      loveLines.length;


    loveLine.classList.add(
      "show"
    );

  },1500);

}


showNextLine();


setInterval(
  showNextLine,
  6000
);

</script>

</body>
</html>
