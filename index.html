<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Our Love ❤️</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      color: white;
      font-family: "Poppins", sans-serif;
      background:
        radial-gradient(circle at 20% 20%, rgba(255, 80, 140, 0.20), transparent 30%),
        radial-gradient(circle at 80% 80%, rgba(180, 40, 100, 0.18), transparent 35%),
        linear-gradient(135deg, #09040b, #210b19, #10050d);
    }

    .glow {
      position: fixed;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: rgba(255, 50, 120, 0.10);
      filter: blur(70px);
      pointer-events: none;
    }

    .glow.one {
      top: -100px;
      left: -80px;
    }

    .glow.two {
      bottom: -100px;
      right: -80px;
    }

    .card {
      width: min(92%, 500px);
      padding: 38px 24px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 28px;
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(18px);
      box-shadow: 0 25px 70px rgba(0,0,0,0.45);
    }

    .heart {
      font-size: 62px;
      animation: beat 1.5s infinite;
      filter: drop-shadow(0 0 18px rgba(255,80,130,0.65));
    }

    @keyframes beat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }

    h1 {
      margin: 12px 0 5px;
      font-family: "DM Serif Display", serif;
      font-size: 38px;
      font-weight: 400;
    }

    .since {
      margin-bottom: 28px;
      font-size: 13px;
      opacity: 0.65;
    }

    .label {
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.65;
      margin-bottom: 8px;
    }

    #months {
      font-size: 25px;
      font-weight: 500;
      margin-bottom: 18px;
    }

    #timer {
      font-size: 19px;
      font-weight: 400;
      line-height: 1.8;
    }

    .seconds {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid rgba(255,255,255,0.10);
      font-size: 13px;
      opacity: 0.75;
    }

    #totalSeconds {
      font-size: 17px;
      font-weight: 500;
      margin-top: 5px;
    }

    .footer {
      margin-top: 25px;
      font-size: 12px;
      opacity: 0.45;
    }
  </style>
</head>

<body>

  <div class="glow one"></div>
  <div class="glow two"></div>

  <div class="card">

    <div class="heart">❤️</div>

    <h1>Our Time Together</h1>

    <div class="since">
      Since 30 May 2026 • 12:40 PM
    </div>

    <div class="label">We've been together for</div>

    <div id="months">Loading...</div>

    <div id="timer">Loading...</div>

    <div class="seconds">
      💗 Total seconds together
      <div id="totalSeconds">Loading...</div>
    </div>

    <div class="footer">
      Every second with you matters ❤️
    </div>

  </div>

  <script>
    const start = new Date("2026-05-30T12:40:00+05:30");

    function updateTimer() {

      const now = new Date();

      let totalMilliseconds = now - start;

      if (totalMilliseconds < 0) {
        document.getElementById("months").innerHTML = "Not started yet ❤️";
        document.getElementById("timer").innerHTML = "";
        document.getElementById("totalSeconds").innerHTML = "0";
        return;
      }

      const totalSeconds = Math.floor(totalMilliseconds / 1000);

      let cursor = new Date(start);

      let months = 0;

      while (true) {
        let next = new Date(cursor);
        next.setMonth(next.getMonth() + 1);

        if (next <= now) {
          months++;
          cursor = next;
        } else {
          break;
        }
      }

      let remaining = now - cursor;

      const days = Math.floor(remaining / 86400000);
      remaining %= 86400000;

      const hours = Math.floor(remaining / 3600000);
      remaining %= 3600000;

      const minutes = Math.floor(remaining / 60000);
      const seconds = Math.floor((remaining % 60000) / 1000);

      document.getElementById("months").innerHTML =
        months + (months === 1 ? " Month" : " Months") +
        " • " + days + (days === 1 ? " Day" : " Days");

      document.getElementById("timer").innerHTML =
        String(hours).padStart(2, "0") + " Hours • " +
        String(minutes).padStart(2, "0") + " Minutes • " +
        String(seconds).padStart(2, "0") + " Seconds";

      document.getElementById("totalSeconds").innerHTML =
        totalSeconds.toLocaleString();
    }

    updateTimer();
    setInterval(updateTimer, 1000);
  </script>

</body>
</html>
