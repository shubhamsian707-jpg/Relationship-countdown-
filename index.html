<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Our Love ❤️</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      color: white;
      font-family: "Poppins", sans-serif;
      background:
        radial-gradient(circle at 15% 20%, rgba(255, 70, 130, 0.22), transparent 30%),
        radial-gradient(circle at 85% 80%, rgba(190, 40, 120, 0.20), transparent 35%),
        linear-gradient(135deg, #080308, #250b1b, #10050e);
    }

    .glow {
      position: fixed;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: rgba(255, 60, 130, 0.10);
      filter: blur(75px);
      pointer-events: none;
    }

    .one {
      top: -100px;
      left: -90px;
    }

    .two {
      bottom: -110px;
      right: -90px;
    }

    .card {
      width: min(92%, 500px);
      padding: 38px 24px;
      text-align: center;
      border-radius: 30px;
      border: 1px solid rgba(255,255,255,0.13);
      background: rgba(255,255,255,0.065);
      backdrop-filter: blur(20px);
      box-shadow: 0 25px 80px rgba(0,0,0,0.5);
    }

    .heart {
      font-size: 62px;
      animation: beat 1.5s infinite;
      filter: drop-shadow(0 0 20px rgba(255,70,130,0.7));
    }

    @keyframes beat {
      0%,100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }

    h1 {
      margin: 12px 0 5px;
      font-family: "DM Serif Display", serif;
      font-size: 38px;
      font-weight: 400;
    }

    .since {
      font-size: 13px;
      opacity: 0.65;
      margin-bottom: 28px;
    }

    .label {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.6;
      margin-top: 14px;
    }

    .big {
      font-size: 25px;
      font-weight: 500;
      margin-top: 6px;
    }

    #time {
      font-size: 18px;
      line-height: 1.8;
      margin-top: 5px;
    }

    .seconds {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid rgba(255,255,255,0.10);
      font-size: 12px;
      opacity: 0.7;
    }

    #totalSeconds {
      font-size: 17px;
      font-weight: 500;
      margin-top: 5px;
    }

    .note {
      margin-top: 24px;
      font-family: "DM Serif Display", serif;
      font-size: 17px;
      line-height: 1.6;
      opacity: 0.9;
    }

    .footer {
      margin-top: 18px;
      font-size: 11px;
      opacity: 0.4;
    }
  </style>
</head>

<body>

  <div class="glow one"></div>
  <div class="glow two"></div>

  <div class="card">

    <div class="heart">❤️</div>

    <h1>Our Time Together</h1>

    <div class="since">
      Since 30 May 2026 • 12:40 PM
    </div>

    <div class="label">Months Together</div>
    <div class="big" id="months">Loading...</div>

    <div class="label">Days Together</div>
    <div class="big" id="days">Loading...</div>

    <div class="label">Time Together</div>
    <div id="time">Loading...</div>

    <div class="seconds">
      💗 Total seconds together
      <div id="totalSeconds">Loading...</div>
    </div>

    <div class="note">
      "No matter how many seconds pass,<br>
      every one of them becomes a little memory of us. ❤️"
    </div>

    <div class="footer">
      Every second with you matters.
    </div>

  </div>

  <script>
    const start = new Date("2026-05-30T12:40:00+05:30");

    function updateTimer() {

      const now = new Date();
      const difference = now - start;

      if (difference < 0) {
        document.getElementById("months").innerHTML = "Not started yet ❤️";
        document.getElementById("days").innerHTML = "0 Days";
        document.getElementById("time").innerHTML = "00 Hours • 00 Minutes • 00 Seconds";
        document.getElementById("totalSeconds").innerHTML = "0";
        return;
      }

      const totalSeconds = Math.floor(difference / 1000);

      const totalDays = Math.floor(difference / 86400000);

      let cursor = new Date(start);
      let months = 0;

      while (true) {
        let next = new Date(cursor);
        next.setMonth(next.getMonth() + 1);

        if (next <= now) {
          months++;
          cursor = next;
        } else {
          break;
        }
      }

      let remaining = now - cursor;

      const hours = Math.floor(remaining / 3600000);
      remaining %= 3600000;

      const minutes = Math.floor(remaining / 60000);
      const seconds = Math.floor((remaining % 60000) / 1000);

      document.getElementById("months").innerHTML =
        months + (months === 1 ? " Month" : " Months");

      document.getElementById("days").innerHTML =
        totalDays + (totalDays === 1 ? " Day" : " Days");

      document.getElementById("time").innerHTML =
        String(hours).padStart(2, "0") + " Hours • " +
        String(minutes).padStart(2, "0") + " Minutes • " +
        String(seconds).padStart(2, "0") + " Seconds";

      document.getElementById("totalSeconds").innerHTML =
        totalSeconds.toLocaleString();
    }

    updateTimer();
    setInterval(updateTimer, 1000);
  </script>

</body>
</html>
