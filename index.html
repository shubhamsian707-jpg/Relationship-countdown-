<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>D ♡ S — OUR LITTLE STORY</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  color:#fff;
  font-family:"Montserrat",sans-serif;

  /* SAME BACKGROUND */
  background:
    radial-gradient(circle at 50% 45%,rgba(255,40,110,.13),transparent 32%),
    radial-gradient(circle at 15% 15%,rgba(180,20,80,.13),transparent 30%),
    radial-gradient(circle at 85% 85%,rgba(255,30,90,.10),transparent 30%),
    linear-gradient(145deg,#050205,#12050c,#210711,#070307);
}

/* BACKGROUND GLOW */

.glow{
  position:fixed;
  width:320px;
  height:320px;
  border-radius:50%;
  filter:blur(100px);
  opacity:.28;
  pointer-events:none;
  animation:breathe 7s ease-in-out infinite;
}

.glow.one{
  background:#ff176f;
  top:-170px;
  left:-150px;
}

.glow.two{
  background:#a50048;
  bottom:-180px;
  right:-150px;
  animation-delay:3s;
}

@keyframes breathe{
  0%,100%{
    transform:scale(1);
    opacity:.22;
  }

  50%{
    transform:scale(1.18);
    opacity:.34;
  }
}

/* BACKGROUND PARTICLES */

.particle{
  position:fixed;
  width:2px;
  height:2px;
  border-radius:50%;
  background:#ff8ab4;
  opacity:0;
  pointer-events:none;
  animation:particleMove linear forwards;
}

@keyframes particleMove{
  0%{
    transform:translateY(20px);
    opacity:0;
  }

  20%{
    opacity:.45;
  }

  80%{
    opacity:.2;
  }

  100%{
    transform:translateY(-100vh);
    opacity:0;
  }
}

/* MAIN CARD */

.card{
  position:relative;
  z-index:2;

  width:min(92%,500px);

  padding:35px 22px 28px;

  text-align:center;

  border:1px solid rgba(255,110,160,.20);
  border-radius:30px;

  background:rgba(15,3,10,.45);

  backdrop-filter:blur(18px);

  box-shadow:
    0 30px 100px rgba(0,0,0,.65),
    0 0 50px rgba(255,30,100,.05);
}

/* INJECTION */

.injection-area{
  height:82px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  margin-bottom:8px;

  opacity:0;
  transform:translateY(5px);

  animation:injectionShow 5s ease-in-out infinite;
}

.injection{
  position:relative;

  width:76px;
  height:24px;

  display:flex;
  align-items:center;
  justify-content:center;

  transform:rotate(-7deg);

  filter:
    drop-shadow(0 0 5px rgba(255,60,130,.7))
    drop-shadow(0 0 12px rgba(255,40,120,.35));
}

/* SYRINGE */

.syringe-body{
  position:relative;

  width:42px;
  height:14px;

  border:1px solid rgba(255,170,200,.85);
  border-radius:4px;

  background:rgba(255,70,140,.12);

  overflow:hidden;
}

/* LOVE INSIDE */

.love-liquid{
  position:absolute;

  left:0;
  top:0;

  width:100%;
  height:100%;

  background:
    linear-gradient(
      90deg,
      rgba(255,40,110,.75),
      rgba(255,120,180,.95)
    );

  box-shadow:
    0 0 8px rgba(255,40,120,.8);
}

.love-liquid::after{
  content:"♥  ♥  ♥";

  position:absolute;

  left:4px;
  top:0;

  font-size:7px;
  line-height:13px;

  color:#fff;

  opacity:.9;

  animation:liquidMove 2s linear infinite;
}

@keyframes liquidMove{
  from{
    transform:translateX(0);
  }

  to{
    transform:translateX(-8px);
  }
}

.needle{
  width:17px;
  height:1px;

  background:#ffc2d8;

  box-shadow:
    0 0 5px #ff5b94;
}

.plunger{
  width:8px;
  height:19px;

  border:1px solid #ff9dbc;
  border-radius:2px;

  margin-right:2px;

  box-shadow:
    0 0 6px rgba(255,70,140,.5);
}

.handle{
  position:absolute;
  right:1px;

  width:6px;
  height:18px;

  border:1px solid #ff9dbc;
  border-radius:2px;
}

.injection-text{
  margin-top:7px;

  font-size:8px;
  font-weight:600;

  letter-spacing:2px;

  color:#ffb5cc;

  text-shadow:
    0 0 8px rgba(255,60,130,.7);
}

/* FASTER FADE */

@keyframes injectionShow{

  0%,8%{
    opacity:0;
    transform:translateY(5px);
  }

  18%,50%{
    opacity:1;
    transform:translateY(0);
  }

  62%,100%{
    opacity:0;
    transform:translateY(-5px);
  }
}

/* INITIALS */

.initials{
  font-size:14px;
  font-weight:600;

  letter-spacing:4px;

  color:#ffb0c9;

  margin-bottom:17px;

  opacity:.9;
}

.initials span{
  display:inline-block;

  animation:
    heartPulse 2.2s ease-in-out infinite;
}

@keyframes heartPulse{

  0%,100%{
    transform:scale(1);

    text-shadow:
      0 0 5px rgba(255,70,130,.3);
  }

  50%{
    transform:scale(1.18);

    text-shadow:
      0 0 14px rgba(255,70,130,.8);
  }
}

/* TITLE */

.title{
  margin:0;

  font-size:28px;
  font-weight:600;

  letter-spacing:6px;
}

.since{
  margin-top:10px;

  font-size:10px;

  letter-spacing:2px;

  opacity:.48;
}

/* COUNTDOWN */

.countdown{
  position:relative;

  margin-top:30px;

  padding:27px 14px 23px;

  border:1px solid rgba(255,70,130,.52);

  border-radius:24px;

  background:
    linear-gradient(
      145deg,
      rgba(255,30,100,.075),
      rgba(255,255,255,.025)
    );

  box-shadow:
    0 0 22px rgba(255,30,100,.12),
    inset 0 0 30px rgba(255,30,100,.025);

  animation:
    boxPulse 3s ease-in-out infinite;

  overflow:visible;
}

@keyframes boxPulse{

  0%,100%{
    box-shadow:
      0 0 18px rgba(255,30,100,.10),
      inset 0 0 25px rgba(255,30,100,.02);
  }

  50%{
    box-shadow:
      0 0 30px rgba(255,30,100,.20),
      inset 0 0 30px rgba(255,30,100,.04);
  }
}

/* COUNTDOWN NUMBERS */

.duration,
.time,
.total-number{
  transition:
    text-shadow .25s ease,
    transform .25s ease;
}

.duration{
  font-size:23px;

  font-weight:600;

  letter-spacing:2px;
}

.time{
  margin-top:16px;

  font-size:15px;

  font-weight:500;

  letter-spacing:2px;

  opacity:.88;
}

.total{
  margin-top:20px;

  padding-top:16px;

  border-top:
    1px solid rgba(255,255,255,.08);

  font-size:8px;

  letter-spacing:3px;

  opacity:.45;
}

.total-number{
  margin-top:6px;

  font-size:16px;

  font-weight:600;

  letter-spacing:2px;

  opacity:.9;
}

.number-flash{
  transform:scale(1.035);

  text-shadow:
    0 0 12px rgba(255,80,150,.8),
    0 0 24px rgba(255,30,110,.35);
}

/* BORDER SPARKLE */

.border-sparkle{
  position:absolute;

  width:4px;
  height:4px;

  border-radius:50%;

  background:#ffd6e5;

  box-shadow:
    0 0 5px #fff,
    0 0 12px #ff4d91;

  pointer-events:none;

  opacity:0;

  animation:
    sparkleTravel 2s linear forwards;
}

@keyframes sparkleTravel{

  0%{
    left:4%;
    top:-2px;
    opacity:0;
  }

  10%{
    opacity:1;
  }

  45%{
    left:98%;
    top:-2px;
    opacity:1;
  }

  55%{
    left:100%;
    top:50%;
  }

  70%{
    left:98%;
    top:calc(100% - 2px);
  }

  88%{
    left:4%;
    top:calc(100% - 2px);
    opacity:.7;
  }

  100%{
    left:0%;
    top:50%;
    opacity:0;
  }
}

/* LOVE LINES */

.line-box{
  min-height:58px;

  margin-top:24px;

  display:flex;

  justify-content:center;

  align-items:center;
}

.love-line{
  max-width:390px;

  font-size:12px;

  font-weight:500;

  line-height:1.8;

  letter-spacing:2px;

  opacity:0;

  transform:translateY(5px);

  transition:
    opacity 1.5s ease,
    transform 1.5s ease;
}

.love-line.show{
  opacity:.78;

  transform:translateY(0);
}

/* FLYING HEART */

.timer-heart{
  position:fixed;

  z-index:10;

  pointer-events:none;

  font-size:12px;

  opacity:0;

  filter:
    drop-shadow(0 0 7px currentColor);

  animation:
    heartFloat 1.7s ease-out forwards;
}

@keyframes heartFloat{

  0%{
    transform:
      translate(0,0)
      scale(.35);

    opacity:0;
  }

  15%{
    opacity:1;
  }

  100%{
    transform:
      translate(var(--x),-115px)
      rotate(var(--r))
      scale(1.05);

    opacity:0;
  }
}

/* HEART TRAIL */

.trail-heart{
  position:fixed;

  z-index:9;

  pointer-events:none;

  font-size:6px;

  color:#ff6b9e;

  opacity:0;

  filter:
    drop-shadow(0 0 5px #ff4c91);

  animation:
    trailFade 1.2s ease-out forwards;
}

@keyframes trailFade{

  0%{
    transform:scale(.4);

    opacity:0;
  }

  20%{
    opacity:.7;
  }

  100%{
    transform:
      translate(
        var(--tx),
        -65px
      )
      scale(.8);

    opacity:0;
  }
}

/* FOOTER */

.footer{
  margin-top:20px;

  font-size:8px;

  letter-spacing:3px;

  opacity:.25;
}

/* MOBILE */

@media(max-width:400px){

  .card{
    padding:30px 15px 25px;
  }

  .title{
    font-size:24px;
    letter-spacing:4px;
  }

  .duration{
    font-size:20px;
  }

  .time{
    font-size:13px;
    letter-spacing:1px;
  }

  .love-line{
    font-size:11px;
  }
}
</style>
</head>

<body>

<div class="glow one"></div>
<div class="glow two"></div>

<div class="card">

  <!-- INJECTION -->

  <div class="injection-area">

    <div class="injection">

      <div class="plunger"></div>

      <div class="syringe-body">
        <div class="love-liquid"></div>
      </div>

      <div class="needle"></div>

      <div class="handle"></div>

    </div>

    <div class="injection-text">
      NO INJECTIONS ALLOWED HERE. ❤️
    </div>

  </div>


  <div class="initials">
    D <span>♡</span> S
    •
    SINCE 30 MAY 2026
  </div>


  <h1 class="title">
    OUR LITTLE STORY
  </h1>


  <div class="since">
    12:40 PM
  </div>


  <!-- COUNTDOWN -->

  <div class="countdown" id="countdownBox">

    <div class="duration" id="duration">
      00 MONTHS • 00 DAYS
    </div>

    <div class="time" id="time">
      00 HRS • 00 MINS • 00 SECS
    </div>

    <div class="total">
      TOTAL SECONDS
    </div>

    <div class="total-number" id="totalSeconds">
      0
    </div>

  </div>


  <!-- 15 AUTOMATIC LINES -->

  <div class="line-box">

    <div
      class="love-line"
      id="loveLine">
    </div>

  </div>


  <div class="footer">
    EVERY SECOND BECOMES A MEMORY.
  </div>

</div>


<script>

/* ===============================
   START DATE
================================ */

const start =
  new Date(
    "2026-05-30T12:40:00+05:30"
  );


let lastSecond = -1;


/* ===============================
   COUNTDOWN
================================ */

function updateTimer(){

  const now =
    new Date();

  const difference =
    now - start;

  if(difference < 0)
    return;


  const totalSeconds =
    Math.floor(
      difference / 1000
    );


  let cursor =
    new Date(start);

  let months = 0;


  while(true){

    const next =
      new Date(cursor);

    next.setMonth(
      next.getMonth() + 1
    );


    if(next <= now){

      months++;

      cursor =
        next;

    }else{

      break;

    }

  }


  let remaining =
    now - cursor;


  const days =
    Math.floor(
      remaining / 86400000
    );

  remaining %=
    86400000;


  const hours =
    Math.floor(
      remaining / 3600000
    );

  remaining %=
    3600000;


  const minutes =
    Math.floor(
      remaining / 60000
    );


  const seconds =
    Math.floor(
      (remaining % 60000) /
      1000
    );


  const duration =
    document.getElementById(
      "duration"
    );


  const time =
    document.getElementById(
      "time"
    );


  const total =
    document.getElementById(
      "totalSeconds"
    );


  duration.innerHTML =

    String(months).padStart(2,"0") +
    " MONTHS • " +

    String(days).padStart(2,"0") +
    " DAYS";


  time.innerHTML =

    String(hours).padStart(2,"0") +
    " HRS • " +

    String(minutes).padStart(2,"0") +
    " MINS • " +

    String(seconds).padStart(2,"0") +
    " SECS";


  total.innerHTML =
    totalSeconds.toLocaleString();


  /* NEW SECOND */

  if(seconds !== lastSecond){

    lastSecond =
      seconds;


    flashNumber(
      time
    );


    createTimerHeart();

  }

}


/* ===============================
   NUMBER FLASH
================================ */

function flashNumber(element){

  element.classList.remove(
    "number-flash"
  );


  void element.offsetWidth;


  element.classList.add(
    "number-flash"
  );


  setTimeout(() => {

    element.classList.remove(
      "number-flash"
    );

  },250);

}


/* ===============================
   FLYING HEART
================================ */

function createTimerHeart(){

  const heart =
    document.createElement(
      "div"
    );


  heart.className =
    "timer-heart";


  heart.innerHTML =
    Math.random() > .5
      ? "♥"
      : "♡";


  const colors = [

    "#ff3d82",
    "#ff5c9a",
    "#ff1744",
    "#ff8ab7"

  ];


  heart.style.color =
    colors[
      Math.floor(
        Math.random() *
        colors.length
      )
    ];


  const timer =
    document.getElementById(
      "time"
    );


  const rect =
    timer.getBoundingClientRect();


  heart.style.left =
    (
      rect.right -
      35 +
      Math.random()*30
    ) + "px";


  heart.style.top =
    (
      rect.bottom -
      8
    ) + "px";


  /* LEFT OR RIGHT */

  const direction =
    Math.random() < .5
      ? -1
      : 1;


  const distance =
    25 +
    Math.random()*65;


  heart.style.setProperty(
    "--x",
    (direction * distance) +
    "px"
  );


  heart.style.setProperty(
    "--r",
    (
      Math.random()*50 -
      25
    ) + "deg"
  );


  document.body.appendChild(
    heart
  );


  /* HEART TRAIL */

  createTrail(
    rect,
    direction
  );


  setTimeout(
    () => heart.remove(),
    1800
  );

}


/* ===============================
   HEART TRAIL
================================ */

function createTrail(
  rect,
  direction
){

  for(
    let i=0;
    i<2;
    i++
  ){

    const trail =
      document.createElement(
        "div"
      );


    trail.className =
      "trail-heart";


    trail.innerHTML =
      "♥";


    trail.style.left =
      (
        rect.right -
        25 +
        Math.random()*20
      ) + "px";


    trail.style.top =
      (
        rect.bottom -
        5 +
        i*7
      ) + "px";


    trail.style.setProperty(
      "--tx",
      (
        direction *
        (10 + Math.random()*35)
      ) + "px"
    );


    document.body.appendChild(
      trail
    );


    setTimeout(
      () => trail.remove(),
      1300
    );

  }

}


/* ===============================
   15 LOVE LINES
================================ */

const loveLines = [

  "EVERY SECOND WITH YOU MATTERS. ❤️",

  "STILL MY FAVORITE PERSON. ❤️",

  "ANOTHER SECOND. ANOTHER MEMORY OF US.",

  "YOU MAKE TIME FEEL BEAUTIFUL. ❤️",

  "ONE MORE LITTLE MEMORY OF US. 💗",

  "EVERY DAY WITH YOU FEELS SPECIAL.",

  "STILL CHOOSING US. ❤️",

  "YOU MAKE ORDINARY MOMENTS SPECIAL.",

  "ANOTHER SECOND. ANOTHER REASON TO SMILE. 💕",

  "SOMEHOW, I LOVE YOU A LITTLE MORE TODAY.",

  "OUR LITTLE FOREVER KEEPS GROWING. ❤️",

  "YOU ARE MY FAVORITE PART OF EVERY DAY.",

  "TIME PASSES. OUR MEMORIES STAY.",

  "JUST YOU AND ME, ONE SECOND AT A TIME. ❤️",

  "HERE'S TO EVERY SECOND STILL TO COME. 💗"

];


let lineIndex =
  0;


const loveLine =
  document.getElementById(
    "loveLine"
  );


function showNextLine(){

  loveLine.classList.remove(
    "show"
  );


  setTimeout(() => {

    loveLine.innerHTML =
      loveLines[lineIndex];


    lineIndex =
      (
        lineIndex + 1
      ) %
      loveLines.length;


    loveLine.classList.add(
      "show"
    );

  },1500);

}


showNextLine();


setInterval(
  showNextLine,
  6000
);


/* ===============================
   BORDER SPARKLE
================================ */

function createSparkle(){

  const box =
    document.getElementById(
      "countdownBox"
    );


  const sparkle =
    document.createElement(
      "div"
    );


  sparkle.className =
    "border-sparkle";


  box.appendChild(
    sparkle
  );


  setTimeout(
    () => sparkle.remove(),
    2100
  );

}


/* OCCASIONAL SPARKLE */

setInterval(
  createSparkle,
  7500
);


/* ===============================
   BACKGROUND PARTICLES
================================ */

function createParticle(){

  const particle =
    document.createElement(
      "div"
    );


  particle.className =
    "particle";


  particle.style.left =
    Math.random()*100 +
    "vw";


  particle.style.bottom =
    "-10px";


  particle.style.animationDuration =
    (
      8 +
      Math.random()*7
    ) + "s";


  document.body.appendChild(
    particle
  );


  setTimeout(
    () => particle.remove(),
    15000
  );

}


setInterval(
  createParticle,
  900
);


/* START */

updateTimer();


setInterval(
  updateTimer,
  250
);

</script>

</body>
</html>
